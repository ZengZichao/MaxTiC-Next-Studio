name: CI

# Studio 是独立仓库，但算法来自另一个仓库 MaxTiC-Next。
# 两者的依赖关系一律通过仓库地址表达（与 README 给用户的安装方式一致），
# 不依赖任何本地目录布局。GUI 用例走 Qt 的 offscreen 平台，无需 X server。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 同一分支连续 push 时取消仍在跑的旧一轮：macOS runner 计费 10 倍，避免白烧。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CORE_REPO_URL: https://github.com/ZengZichao/MaxTiC-Next
  # CI/发布统一锁核心仓 tag：核心 main 一变就会把本仓 CI 打红，构建也不可复现。
  # 核心仓发新版本时同步 bump 这里（release.yml 引用同一变量）。
  CORE_REF: v0.1.1

jobs:
  # ------------------------------------------------------------ GUI 层测试
  studio:
    name: studio (offscreen GUI)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 覆盖 pyproject 声明的 requires-python >=3.9（含 3.9：PySide6 在该版本上解析到
        # 6.10.x，套件在 3.9 上实测通过）。
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime deps
        # Qt 的 offscreen 平台需要这几个系统库（ubuntu-latest 默认不全）
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install the core package, then Studio
        run: |
          python -m pip install --upgrade pip
          pip install "git+${{ env.CORE_REPO_URL }}.git@${{ env.CORE_REF }}"
          pip install -e ".[dev]"
      - name: Run tests offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v --tb=short

  # ------------------------------------------------------------ 静态检查
  lint:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install "git+${{ env.CORE_REPO_URL }}.git@${{ env.CORE_REF }}"
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests packaging
      - name: Ruff format
        run: ruff format --check src tests packaging
      - name: Mypy
        run: mypy

  # -------------------------------------------------- 桌面应用打包自检
  package:
    name: build .app (smoke)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install "git+${{ env.CORE_REPO_URL }}.git@${{ env.CORE_REF }}"
          pip install -e ".[dev]"
      - name: Freeze the bundle
        run: bash packaging/build_studio_app.sh
      - name: Check the produced bundle
        run: |
          test -d release/MaxTiC-Next-Studio.app/Contents/MacOS
          # 演示数据与图标母版都必须随包内置，否则 .app 开箱即坏
          test -d release/MaxTiC-Next-Studio.app/Contents/Resources/examples
          test -f release/MaxTiC-Next-Studio.app/Contents/Resources/assets/maxtic-studio.svg
          test -f release/MaxTiC-Next-Studio.app/Contents/Resources/maxtic-studio.icns

  # ------------------------------------------------ 聚合门禁（分支保护必需检查）
  # 矩阵 job 会按变体拆成多个 check，逐个设必需检查太脆；
  # 统一只把本 job 设为必需：任一前置 job 失败时它会保持 skipped，
  # "ci-ok" 状态不通过，合并即被拦截。
  ci-ok:
    needs: [studio, lint, package]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI jobs passed"
