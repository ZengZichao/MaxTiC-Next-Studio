<?xml version="1.0" encoding="UTF-8"?>
<!--
  MaxTiC-Next Studio 应用图标（唯一母版）

  图形语言对应软件本身：一棵有根物种树（正交谱系图）+ 一条跨越分支的
  横向转移弧（HGT）+ 一个被点亮的内部节点（MTC 排名的对象）。
  配色取自 theme.py 的品牌令牌：primary #0F6E56 / primary_pressed #0B5040，
  转移弧用 warning 色做对比强调。

  全部图形都用 <path>/<circle> 与内联渐变，不引用外部资源、不使用滤镜与文字，
  以便在 16px 下仍可辨识，并能被 Qt 的 SVG 渲染器与 iconutil 转换链正确消费。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MaxTiC-Next Studio">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#14815F"/>
      <stop offset="1" stop-color="#0A4A3A"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 圆角方块底 -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#sheen)"/>
  <rect x="24.5" y="24.5" width="463" height="463" rx="101" fill="none" stroke="#9FE1CB" stroke-opacity="0.28" stroke-width="3"/>

  <!-- 谱系树：正交边，4 个现生类群 -->
  <g fill="none" stroke="#EAF7F2" stroke-width="21" stroke-linecap="round" stroke-linejoin="round">
    <!-- 根 → 首个内部分叉 -->
    <path d="M96 256 H182"/>
    <!-- 第一层分叉的上下两支 -->
    <path d="M182 138 V374"/>
    <path d="M182 138 H262"/>
    <path d="M182 374 H298"/>
    <!-- 第二层分叉 -->
    <path d="M262 84 V192"/>
    <path d="M262 84 H404"/>
    <path d="M262 192 H404"/>
    <path d="M298 320 V428"/>
    <path d="M298 320 H404"/>
    <path d="M298 428 H404"/>
  </g>

  <!-- 横向基因转移：跨越两支的虚线弧 + 箭头 -->
  <g fill="none" stroke="#FACC15" stroke-width="17" stroke-linecap="round" stroke-dasharray="2 34">
    <path d="M356 428 C356 300 214 300 214 168"/>
  </g>
  <path d="M214 168 l-27 44 h54 z" fill="#FACC15"/>

  <!-- 被点亮的内部节点：MTC 排名对象 -->
  <circle cx="182" cy="256" r="41" fill="#34C39A" stroke="#04231B" stroke-opacity="0.35" stroke-width="7"/>
  <circle cx="182" cy="256" r="17" fill="#04231B" fill-opacity="0.55"/>

  <!-- 现生类群末端点 -->
  <g fill="#EAF7F2">
    <circle cx="404" cy="84" r="15"/>
    <circle cx="404" cy="192" r="15"/>
    <circle cx="404" cy="320" r="15"/>
    <circle cx="404" cy="428" r="15"/>
  </g>
</svg>
